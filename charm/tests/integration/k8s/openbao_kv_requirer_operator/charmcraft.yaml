name: openbao-kv-requirer

summary: OpenBao KV Requirer
description: OpenBao KV Requirer

assumes:
  - juju >= 3.1
  - k8s-api

requires:
  openbao-kv:
    interface: openbao-kv
    limit: 1

storage:
  certs:
    type: filesystem
    minimum-size: 5M

type: charm
platforms:
  ubuntu@24.04:amd64:

parts:
  charm:
    source: .
    plugin: uv
    build-packages:
      - libffi-dev
      - libssl-dev
      - pkg-config
    build-snaps:
      - astral-uv
      - rustup
    override-build: |
      rustup default stable
      craftctl default

charm-libs:
  - lib: vault_k8s.vault_kv
    version: "0.16"

actions:
  create-secret:
    description: Creates a secret in OpenBao
    params:
      key:
        description: The key to create
        type: string
      value:
        description: The value to create
        type: string
    required: [key, value]

  get-secret:
    description: Gets a secret from OpenBao
    params:
      key:
        description: The key to get
        type: string
    required: [key]
