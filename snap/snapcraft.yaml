name: openbao
title: OpenBao
summary: The Snap for OpenBao
description: |
  A snap for Openbao, a community-driven fork of Vault managed by the Linux Foundation.

version: "v2.6.0"
base: core26
source-code: https://github.com/openbao/openbao
issues: https://github.com/canonical/openbao-omnicraft/issues
license: MPL-2.0
platforms:
  amd64:
  arm64:
  armhf:
  ppc64el:
  s390x:

grade: stable
confinement: strict

apps:
  bao:
    command: bin/bao
    plugs:
      - network
      - network-bind
      - home
  server:
    command: bin/baod-start
    plugs:
      - network
      - network-bind
      # Required for PKCS#11 KMS plugin to access HSMs via USB
      - hardware-observe
      - raw-usb

    daemon: simple
    install-mode: disable
    refresh-mode: endure

    reload-command: bin/baod-reload
    stop-command: bin/baod-stop
    restart-condition: on-failure
    stop-mode: sigterm

parts:
  openbao:
    source: https://github.com/openbao/openbao.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    source-type: git
    source-depth: 1

    plugin: nil
    override-build: |
      make bootstrap
      corepack enable pnpm

      VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//')"
      GIT_COMMIT="$(git rev-parse HEAD)"
      BUILD_DATE="$(git show --no-show-signature -s --format=%cd --date=format:'%Y-%m-%dT%H:%M:%SZ' HEAD)"
      export LD_FLAGS="-X github.com/openbao/openbao/version.fullVersion=${VERSION} -X github.com/openbao/openbao/version.GitCommit=${GIT_COMMIT} -X github.com/openbao/openbao/version.BuildDate=${BUILD_DATE}"

      make static-dist bin
      install -D -m755 bin/bao $SNAPCRAFT_PART_INSTALL/bin/bao

    build-snaps:
      - go/1.26/stable
    build-packages:
      - make
      - nodejs

  # Shared libraries commonly required by vendor PKCS#11 modules under strict confinement
  pkcs11-runtime-libs:
    plugin: nil
    stage-packages:
      - libcurl4t64
      - libusb-1.0-0
    stage:
      - usr/lib
    prime:
      - usr/lib

  # External PKCS#11 KMS plugin
  openbao-kms-pkcs11:
    source: https://github.com/openbao/openbao-plugins.git
    source-tag: kms-pkcs11-v0.1.0
    source-type: git
    source-depth: 1
    plugin: nil
    build-snaps:
      - go/1.26/stable
    build-packages:
      - gcc
      - libc6-dev
      - make
    override-build: |
      set -e
      PLUGIN_VERSION="v0.1.0"
      PLUGIN_NAME="openbao-plugin-kms-pkcs11"
      DEST_DIR="$SNAPCRAFT_PART_INSTALL/plugins"
      mkdir -p "$DEST_DIR"

      case "${CRAFT_ARCH_BUILD_FOR:-}" in
        amd64|arm64)
          make build PLUGIN=kms-pkcs11
          BUILT="$(find bin -maxdepth 1 -type f -name "${PLUGIN_NAME}_linux_*" | head -n1)"
          if [ -z "$BUILT" ]; then
            echo "ERROR: PKCS#11 KMS plugin binary not found under bin/" >&2
            ls -la bin || true
            exit 1
          fi
          install -D -m755 "$BUILT" "$DEST_DIR/$PLUGIN_NAME"
          printf '%s\n' "$PLUGIN_VERSION" > "$DEST_DIR/pkcs11.version"
          ;;
        *)
          echo "Skipping PKCS#11 KMS plugin build for arch ${CRAFT_ARCH_BUILD_FOR:-unknown}"
          printf '%s\n' "unsupported" > "$DEST_DIR/pkcs11.version"
          ;;
      esac


  hooks:
    plugin: dump
    source: hooks
    organize:
      install: snap/hooks/install

  service-files:
    after: [openbao-kms-pkcs11]
    plugin: dump
    source: service
    override-build: |
      set -e
      craftctl default
      CONFIG="$SNAPCRAFT_PART_INSTALL/openbao-config.hcl"
      PLUGIN="$SNAPCRAFT_STAGE/plugins/openbao-plugin-kms-pkcs11"
      if [ -f "$PLUGIN" ]; then
        SHA="$(sha256sum "$PLUGIN" | cut -d' ' -f1)"
        sed -i "s/__OPENBAO_PKCS11_PLUGIN_SHA256__/${SHA}/" "$CONFIG"
      else
        # Strip the PKCS#11 plugin stanza on arches that do not ship the binary.
        awk '
          /^# PKCS#11 KMS plugin/ { skip=1; next }
          skip && /^plugin_directory / { next }
          skip && /^plugin_auto_register / { next }
          skip && /^$/ { next }
          skip && /^plugin "kms" "pkcs11"/ { in_plugin=1; next }
          skip && in_plugin && /^}/ { skip=0; in_plugin=0; next }
          skip && in_plugin { next }
          skip { next }
          { print }
        ' "$CONFIG" > "$CONFIG.tmp"
        mv "$CONFIG.tmp" "$CONFIG"
      fi

package-repositories:
 - type: apt
   url: https://deb.nodesource.com/node_20.x
   components: [main]
   suites: [nodistro]
   key-id: 6F71F525282841EEDAF851B42F59B5F99B1BE0B4
