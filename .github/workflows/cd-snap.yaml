# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: OpenBao Snap CI/CD

on:
  workflow_call:
    inputs:
      build:
        description: Build and test the snap from source; when false, re-upload the latest previously built snap artifact
        type: boolean
        required: false
        default: true

env:
  SNAP_VERSION: 2.5.2

jobs:
  continuous-delivery-snap:
    name: Continuous delivery
    runs-on: ubuntu-24.04
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.3
        name: Prepare environment
        with:
          workflows-ref: v3.1.3
      - name: Setup toolchains
        if: inputs.build
        env:
          TOOLCHAINS: snapcraft
        run: just setup
      - name: Build snap
        if: inputs.build
        uses: canonical/identity-credentials-workflows/.github/actions/build@v3.1.3
        with:
          working-directory: snap/${{env.SNAP_VERSION}}
          snapcraft-enabled: "true"
      - name: Locate snap artifact
        if: inputs.build
        id: artifacts
        run: echo "snap=$(ls ${{ github.workspace }}/snap/${{env.SNAP_VERSION}}/*.snap | head -1)" >> "$GITHUB_OUTPUT"
      - name: Run integration tests
        if: inputs.build
        uses: canonical/identity-credentials-workflows/.github/actions/integration-test@v3.1.3
        with:
          working-directory: snap/${{env.SNAP_VERSION}}
          snap-enabled: "true"
      - name: Fetch latest snap from the Snap Store
        if: ${{ !inputs.build }}
        run: |
          name=$(yq '.name' snap/${{ env.SNAP_VERSION }}/snapcraft.yaml)
          snap download "${name}" --channel=latest/edge --target-directory=snap/${{ env.SNAP_VERSION }}
          ls snap/${{ env.SNAP_VERSION }}/*.snap
      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: snap-amd64
          path: snap/${{ env.SNAP_VERSION }}/*.snap
          if-no-files-found: error
