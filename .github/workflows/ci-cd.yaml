# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: OpenBao CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  continuous-integration:
    name: code quality and health checks
    runs-on: ubuntu-26.04
    outputs:
      snap-changed: ${{ steps.changes.outputs.snap }}
      rock-changed: ${{ steps.changes.outputs.rock }}
      charm-machine-changed: ${{ steps.changes.outputs.charm-machine }}
      charm-k8s-changed: ${{ steps.changes.outputs.charm-k8s }}
    steps:
      - name: Detect modified subfolders
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            snap:
              - 'snap/**'
            rock:
              - 'rock/**'
            charm-machine:
              - 'charm/machine/**'
            charm-k8s:
              - 'charm/k8s/**'

      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.3
        with:
          workflows-ref: v3.1.3
      - name: Setup toolchains
        env:
          TOOLCHAINS: python go
        run: just setup
      - name: Ensure vendored shared code is in sync
        run: |
          make -C charm/k8s vendor-shared-code
          make -C charm/machine vendor-shared-code
      - name: Shared package code quality
        uses: canonical/identity-credentials-workflows/.github/actions/code-quality@v3.1.3
        with:
          working-directory: charm/openbao-package
          python-enabled: "true"
      - name: Machine charm code quality
        uses: canonical/identity-credentials-workflows/.github/actions/code-quality@v3.1.3
        with:
          working-directory: charm/machine
          python-enabled: "true"
          grafana-enabled: "true"
          grafana-dashboard-file-path: src/grafana_dashboards/openbao.json
      - name: K8s charm code quality
        uses: canonical/identity-credentials-workflows/.github/actions/code-quality@v3.1.3
        with:
          working-directory: charm/k8s
          python-enabled: "true"
          grafana-enabled: "true"
          grafana-dashboard-file-path: src/grafana_dashboards/openbao.json
      - name: Shared package unit tests
        uses: canonical/identity-credentials-workflows/.github/actions/unit-test@v3.1.3
        with:
          working-directory: charm/openbao-package
          python-enabled: "true"
      - name: Machine charm unit tests
        uses: canonical/identity-credentials-workflows/.github/actions/unit-test@v3.1.3
        with:
          working-directory: charm/machine
          python-enabled: "true"
      - name: K8s charm unit tests
        uses: canonical/identity-credentials-workflows/.github/actions/unit-test@v3.1.3
        with:
          working-directory: charm/k8s
          python-enabled: "true"
  continuous-delivery-snap:
    name: snap
    needs: continuous-integration
    if: needs.continuous-integration.outputs.snap-changed == 'true'
    uses: ./.github/workflows/cd-snap.yaml
    secrets: inherit
    with:
      build: ${{ needs.continuous-integration.outputs.snap-changed == 'true' }}
  continuous-delivery-rock:
    name: rock
    needs: continuous-integration
    if: needs.continuous-integration.outputs.rock-changed == 'true'
    uses: ./.github/workflows/cd-rock.yaml
    secrets: inherit
    with:
      build: ${{ needs.continuous-integration.outputs.rock-changed == 'true' }}
  continuous-delivery-charm-machine:
    name: machine charm
    needs: continuous-integration
    if: needs.continuous-integration.outputs.charm-machine-changed == 'true'
    uses: ./.github/workflows/cd-charm-machine.yaml
  continuous-delivery-charm-k8s:
    name: k8s charm
    needs: continuous-integration
    if: needs.continuous-integration.outputs.charm-k8s-changed == 'true'
    uses: ./.github/workflows/cd-charm-k8s.yaml
