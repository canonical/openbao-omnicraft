# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: OpenBao Rock CI/CD

on:
  workflow_call:

env:
  ROCK_VERSION: 2.5.2

jobs:
  continuous-delivery-rock:
    name: Continuous delivery
    runs-on: ubuntu-24.04
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.3
        name: Prepare environment
        with:
          workflows-ref: v3.1.3
      - name: Setup toolchains
        env:
          TOOLCHAINS: rockcraft
        run: just setup
      - name: Build rock
        uses: canonical/identity-credentials-workflows/.github/actions/build@v3.1.3
        with:
          working-directory: rock/${{ env.ROCK_VERSION }}
          rockcraft-enabled: "true"
      - name: Locate rock artifact
        id: artifacts
        run: echo "rock=$(ls ${{ github.workspace }}/rock/${{ env.ROCK_VERSION }}/*.rock | head -1)" >> "$GITHUB_OUTPUT"
      - name: Run integration tests
        uses: canonical/identity-credentials-workflows/.github/actions/integration-test@v3.1.3
        with:
          working-directory: rock/${{ env.ROCK_VERSION }}
          rock-enabled: "true"
      - name: Upload rock artifact
        uses: actions/upload-artifact@v7
        with:
          name: rock-amd64
          path: rock/${{ env.ROCK_VERSION }}/*.rock
          if-no-files-found: error
