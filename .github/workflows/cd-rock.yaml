# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: OpenBao Rock CI/CD

on:
  workflow_call:
    inputs:
      build:
        description: Build and test the rock from source; when false, re-upload the latest previously built rock artifact
        type: boolean
        required: false
        default: true

env:
  ROCK_VERSION: 2.5.2

jobs:
  continuous-delivery-rock:
    name: Continuous delivery
    runs-on: ubuntu-24.04
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.3
        name: Prepare environment
        with:
          workflows-ref: v3.1.3
      - name: Setup toolchains
        if: inputs.build
        env:
          TOOLCHAINS: rockcraft
        run: just setup
      - name: Build rock
        if: inputs.build
        uses: canonical/identity-credentials-workflows/.github/actions/build@v3.1.3
        with:
          working-directory: rock/${{ env.ROCK_VERSION }}
          rockcraft-enabled: "true"
      - name: Locate rock artifact
        if: inputs.build
        id: artifacts
        run: echo "rock=$(ls ${{ github.workspace }}/rock/${{ env.ROCK_VERSION }}/*.rock | head -1)" >> "$GITHUB_OUTPUT"
      - name: Run integration tests
        if: inputs.build
        uses: canonical/identity-credentials-workflows/.github/actions/integration-test@v3.1.3
        with:
          working-directory: rock/${{ env.ROCK_VERSION }}
          rock-enabled: "true"
      - name: Fetch latest rock from the container registry
        if: ${{ !inputs.build }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v skopeo >/dev/null || sudo apt-get install -y skopeo
          name=$(yq '.name' rock/${{ env.ROCK_VERSION }}/rockcraft.yaml)
          version=$(yq '.version' rock/${{ env.ROCK_VERSION }}/rockcraft.yaml)
          image="ghcr.io/${{ github.repository_owner }}/${name}:${version}"
          echo "Fetching ${image}"
          skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${GH_TOKEN}"
          skopeo copy --override-arch amd64 "docker://${image}" "oci-archive:rock/${{ env.ROCK_VERSION }}/${name}_${version}_amd64.rock"
          ls rock/${{ env.ROCK_VERSION }}/*.rock
      - name: Upload rock artifact
        uses: actions/upload-artifact@v7
        with:
          name: rock-amd64
          path: rock/${{ env.ROCK_VERSION }}/*.rock
          if-no-files-found: error
