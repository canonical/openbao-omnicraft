# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: OpenBao Rock CI/CD

on:
  workflow_dispatch:

jobs:
  continuous-delivery-rock:
    name: Continuous delivery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        name: check if this part of the repo was changed. if not, end in a success.
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.3
        with:
          workflows-ref: v3.1.3
      - name: Setup toolchains
        env:
          TOOLCHAINS: python go
        run: just setup
