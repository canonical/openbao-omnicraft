# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: OpenBao Rock CI/CD

on:
  workflow_call:
    inputs:
      build:
        description: Build and test the rock from source; when false, re-upload the latest previously built rock artifact
        type: boolean
        required: false
        default: true

jobs:
  continuous-delivery-rock:
    name: Continuous delivery
    runs-on: ubuntu-26.04
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.3
        name: Prepare environment
        with:
          workflows-ref: v3.1.3
      - name: Setup toolchains
        env:
          TOOLCHAINS: rockcraft
        run: just setup
      - name: Build rock
        uses: canonical/identity-credentials-workflows/.github/actions/build@v3.1.3
        with:
          working-directory: rock
          rockcraft-enabled: "true"
      - name: Locate rock artifact
        id: artifacts
        run: echo "rock=$(ls ${{ github.workspace }}/rock/*.rock | head -1)" >> "$GITHUB_OUTPUT"
      - name: Run integration tests
        uses: canonical/identity-credentials-workflows/.github/actions/integration-test@v3.1.3
        with:
          working-directory: rock
          rock-enabled: "true"
      - name: Fetch latest rock from the container registry
        if: false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v skopeo >/dev/null || sudo apt-get install -y skopeo
          name=$(yq '.name' rock/rockcraft.yaml)
          version=$(yq '.version' rock/rockcraft.yaml)
          image="ghcr.io/${{ github.repository_owner }}/${name}:${version}"
          echo "Fetching ${image}"
          skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${GH_TOKEN}"
          skopeo copy --override-arch amd64 "docker://${image}" "oci-archive:rock/${version}/${name}_${version}_amd64.rock"
          ls rock
      - name: Upload rock artifact
        uses: actions/upload-artifact@v7
        with:
          name: rock-amd64
          path: rock/*.rock
          if-no-files-found: error

  publish:
    name: Publish rock
    needs: continuous-delivery-rock
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_CREDENTIALS }}

      - name: Install rockcraft
        run: |
          sudo snap install rockcraft --classic --channel edge

      - uses: actions/download-artifact@v8
        with:
          name: rock-amd64

      - name: Import and push to github package
        run: |
          image_name="$(yq '.name' rock/rockcraft.yaml)"
          version="$(yq '.version' rock/rockcraft.yaml)"
          repo="ghcr.io/canonical/${image_name}"
          amd64_rock_file=$(ls *-amd64.rock | tail -n 1)

          sudo rockcraft.skopeo \
            --insecure-policy \
            copy \
            oci-archive:"${amd64_rock_file}" \
            docker-daemon:"${repo}:${version}-amd64"
          docker push ${repo}:${version}-amd64

          docker manifest create ${repo}:${version} ${repo}:${version}-amd64
          docker manifest push ${repo}:${version}
          docker manifest create ${repo}:latest ${repo}:${version}-amd64
          docker manifest push ${repo}:latest
