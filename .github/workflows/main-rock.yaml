name: Protected Branches

on:
  pull_request:
    branches:
      - main
      - release-*
  push:
    branches:
      - main
      - release-*
  schedule:
    - cron: '0 8 * * 2'

concurrency:
    group: ${{ github.ref == 'refs/heads/main' && format('ignore-main-{0}', github.run_id) || format('{0}-{1}', github.workflow, github.ref_name) }}
    cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:

  build:
    strategy:
      matrix:
        arch:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: [self-hosted, linux, ARM64, medium, jammy]
    uses: canonical/identity-credentials-workflows/.github/workflows/rock-build.yaml@v3.1.3
    with:
      path: rock/2.5.2
      arch: ${{ matrix.arch.arch }}
      runner: ${{ toJson(matrix.arch.runner) }}

  scan:
    needs: build
    uses: canonical/identity-credentials-workflows/.github/workflows/rock-scan.yaml@v3.1.3
    with:
      artifacts-key: ${{ github.sha }}-build-amd64
      arch: amd64
      path: ./rock/2.5.2

  integration-tests:
    needs: build
    uses: ./.github/workflows/rock-integration-tests.yaml

  publish:
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'release-')
    needs: [scan, build, integration-tests]
    permissions:
      contents: read
      packages: write
    uses: canonical/identity-credentials-workflows/.github/workflows/rock-publish.yaml@v3.1.3
    with:
      # The rock is published as ghcr.io/<repository>/<rock-name>, i.e.
      # ghcr.io/canonical/openbao-omnicraft/openbao, which must match the
      # openbao-image upstream-source in charm/k8s/charmcraft.yaml.
      artifacts-key: ${{ github.sha }}-build-*
      architectures: '["amd64", "arm64"]'
      path: rock/2.5.2
