# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: OpenBao Snap Publish

on:
  workflow_call:
    inputs:
      source-run-id:
        description: CI workflow run ID containing the snap artifact
        type: string
        required: true

jobs:
  publish:
    name: Publish snap
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Download snap artifact from CI run
        uses: actions/download-artifact@v8
        with:
          name: snap-amd64
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine snap file name
        id: find-snap
        run: |
          SNAP_FILE=$(ls *.snap)
          echo "Found snap file: $SNAP_FILE"
          echo "snap_file=${SNAP_FILE}" >> "$GITHUB_OUTPUT"

      - name: Publish snap
        uses: canonical/action-publish@v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.find-snap.outputs.snap_file }}
          release: 2/edge
