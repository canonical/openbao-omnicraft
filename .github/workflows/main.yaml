name: CI

on:
  pull_request:
    branches: ["main", "release-*"]
    # `labeled` lets a PR opt in to arm64/s390x tests by adding the
    # `test-arm` / `test-s390x` labels (see the arch build jobs below).
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: ["main", "release-*"]

concurrency:
  group: ${{ (github.ref == 'refs/heads/main' && format('ignore-main-{0}', github.run_id)) || (contains(github.ref, 'refs/heads/release-') && format('ignore-release-{0}', github.run_id)) || format('{0}-{1}', github.workflow, github.ref_name) }}
  cancel-in-progress: true

jobs:
  ensure-shared-code-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Vendor shared code into K8s charm
        working-directory: charm/k8s
        run: make vendor-shared-code
      - name: Vendor shared code into machine charm
        working-directory: charm/machine
        run: make vendor-shared-code
      - name: Ensure vendored code is checked in
        run: |
          STATUS=$(git status --porcelain)
          echo "$STATUS"
          test -z "$STATUS"

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      k8s: ${{ steps.filter.outputs.k8s }}
      machine: ${{ steps.filter.outputs.machine }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            k8s:
              - 'charm/k8s/**'
              - 'charm/openbao-package/**'
              - '.github/workflows/k8s-integration-test*.yaml'
            machine:
              - 'charm/machine/**'
              - 'charm/openbao-package/**'
              - '.github/workflows/machine-integration-test*.yaml'

  snap-build:
    if: github.event.action != 'labeled'
    uses: canonical/identity-credentials-workflows/.github/workflows/snap-build.yaml@v3.1.3
    with:
      path: snap/2.5.2
      artifact-suffix: snap

  snap-build-arm:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'test-arm')
    uses: canonical/identity-credentials-workflows/.github/workflows/snap-build.yaml@v3.1.3
    with:
      path: snap/2.5.2
      arch: arm64
      runner: '["self-hosted", "linux", "ARM64", "medium", "noble"]'
      artifact-suffix: snap

  snap-build-s390x:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'test-s390x')
    uses: canonical/identity-credentials-workflows/.github/workflows/snap-build.yaml@v3.1.3
    with:
      path: snap/2.5.2
      arch: s390x
      runner: '["self-hosted-linux-s390x-noble-medium"]'
      artifact-suffix: snap

  rock-build:
    if: github.event.action != 'labeled'
    uses: canonical/identity-credentials-workflows/.github/workflows/rock-build.yaml@v3.1.3
    with:
      path: rock/2.5.2
      artifact-suffix: rock

  rock-build-arm:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'test-arm')
    uses: canonical/identity-credentials-workflows/.github/workflows/rock-build.yaml@v3.1.3
    with:
      path: rock/2.5.2
      arch: arm64
      runner: '["self-hosted", "linux", "ARM64", "medium", "noble"]'
      artifact-suffix: rock

  k8s-quality:
    name: K8s Quality
    needs: [ensure-shared-code-in-sync]
    runs-on: ubuntu-24.04
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.3
      - uses: canonical/identity-credentials-workflows/.github/actions/code-quality@v3.1.3
        with:
          working-directory: charm/k8s
          python-enabled: "true"
      - uses: canonical/identity-credentials-workflows/.github/actions/unit-test@v3.1.3
        with:
          working-directory: charm/k8s
          python-enabled: "true"

  k8s-grafana-dashboard-lint-report:
    # A pure label-add (`labeled`) re-triggers CI only to run the arch jobs; the
    # AMD-path jobs below already ran, so skip them on that event to save runners.
    if: github.event.action != 'labeled'
    uses: canonical/identity-credentials-workflows/.github/workflows/grafana-dashboard-lint-report.yaml@v3.1.3
    with:
      path: ./charm/k8s/src/grafana_dashboards/*

  k8s-build:
    if: github.event.action != 'labeled'
    needs: [k8s-quality]
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-build.yaml@v3.1.3
    secrets: inherit
    with:
      path: charm/k8s
      artifact-suffix: k8s

  k8s-build-arm:
    # Runs on merge, or on a PR labelled `test-arm` to verify arm64-specific fixes.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'test-arm')
    needs: [k8s-quality]
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-build.yaml@v3.1.3
    secrets: inherit
    with:
      path: charm/k8s
      arch: arm64
      runner: '["self-hosted", "linux", "ARM64", "medium", "noble"]'
      artifact-suffix: k8s

  k8s-build-s390x:
    # Runs on merge, or on a PR labelled `test-s390x` to verify s390x-specific fixes.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'test-s390x')
    needs: [k8s-quality]
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-build.yaml@v3.1.3
    secrets: inherit
    with:
      path: charm/k8s
      arch: s390x
      runner: '["self-hosted-linux-s390x-noble-medium"]'
      artifact-suffix: k8s

  k8s-build-kv-requirer:
    needs: [k8s-quality]
    uses: ./.github/workflows/build-kv-requirer.yaml
    secrets: inherit
    with:
      path: charm/k8s
      artifact-name: kv-requirer-k8s-charm

  k8s-integration-test:
    if: github.event_name == 'push' || needs.changes.outputs.k8s == 'true'
    needs:
      - changes
      - k8s-build
      - k8s-build-kv-requirer
      - rock-build
    runs-on: [self-hosted, linux, X64, large, noble]
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.3
        with:
          workflows-ref: v3.1.3
      - name: Setup juju on Canonical K8s
        env:
          TOOLCHAINS: python juju-k8s
          JUJU_CHANNEL: 3.6/stable
        run: just setup
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.k8s-build.outputs.artifacts-key }}
          path: built/
      - uses: actions/download-artifact@v8
        with:
          name: kv-requirer-k8s-charm
          path: built/
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.rock-build.outputs.artifacts-key }}
          path: built/
      - name: Import rock into Canonical K8s containerd
        run: |
          sudo snap install rockcraft --classic
          ROCK=$(ls built/*.rock | head -1)
          IMAGE=$(yq '.resources.openbao-image.upstream-source' charm/k8s/charmcraft.yaml)
          echo "Importing ${ROCK} as ${IMAGE}"
          sudo rockcraft.skopeo --insecure-policy copy "oci-archive:${ROCK}" "docker-archive:built/openbao-rock.tar:${IMAGE}"
          sudo /snap/k8s/current/bin/ctr --address /run/containerd/containerd.sock --namespace k8s.io images import built/openbao-rock.tar
      - name: Locate artifacts
        id: artifacts
        run: |
          echo "charm=$(ls ${{ github.workspace }}/built/*.charm | grep -v kv-requirer | head -1)" >> "$GITHUB_OUTPUT"
          echo "kv-charm=$(ls ${{ github.workspace }}/built/*kv-requirer*.charm 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "snap=$(ls ${{ github.workspace }}/built/*.snap 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
      - name: Run integration tests
        uses: canonical/identity-credentials-workflows/.github/actions/integration-test@v3.1.3
        env:
          KV_REQUIRER_CHARM_FILE_NAME: ${{ steps.artifacts.outputs.kv-charm }}
        with:
          working-directory: charm/k8s
          charm-enabled: "true"
          charm-file-name: ${{ steps.artifacts.outputs.charm }}

  k8s-integration-test-arm:
    needs:
      - k8s-build-arm
      - k8s-build-kv-requirer
      - rock-build-arm
    runs-on: [self-hosted, linux, ARM64, medium, noble]
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.3
        with:
          workflows-ref: v3.1.3
      - name: Setup juju on Canonical K8s
        env:
          TOOLCHAINS: python juju-k8s
          JUJU_CHANNEL: 3.6/stable
        run: just setup
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.k8s-build-arm.outputs.artifacts-key }}
          path: built/
      - uses: actions/download-artifact@v8
        with:
          name: kv-requirer-k8s-charm
          path: built/
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.rock-build-arm.outputs.artifacts-key }}
          path: built/
      - name: Import rock into Canonical K8s containerd
        run: |
          sudo snap install rockcraft --classic
          ROCK=$(ls built/*.rock | head -1)
          IMAGE=$(yq '.resources.openbao-image.upstream-source' charm/k8s/charmcraft.yaml)
          echo "Importing ${ROCK} as ${IMAGE}"
          sudo rockcraft.skopeo --insecure-policy copy "oci-archive:${ROCK}" "docker-archive:built/openbao-rock.tar:${IMAGE}"
          sudo /snap/k8s/current/bin/ctr --address /run/containerd/containerd.sock --namespace k8s.io images import built/openbao-rock.tar
      - name: Locate artifacts
        id: artifacts
        run: |
          echo "charm=$(ls ${{ github.workspace }}/built/*.charm | grep -v kv-requirer | head -1)" >> "$GITHUB_OUTPUT"
          echo "kv-charm=$(ls ${{ github.workspace }}/built/*kv-requirer*.charm 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "snap=$(ls ${{ github.workspace }}/built/*.snap 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
      - name: Run integration tests
        uses: canonical/identity-credentials-workflows/.github/actions/integration-test@v3.1.3
        env:
          KV_REQUIRER_CHARM_FILE_NAME: ${{ steps.artifacts.outputs.kv-charm }}
          PYTEST_ADDOPTS_EXTRA: -k test_core
        with:
          working-directory: charm/k8s
          charm-enabled: "true"
          charm-file-name: ${{ steps.artifacts.outputs.charm }}

  k8s-integration-test-s390x:
    # Note: the rock does not declare an s390x platform yet, so this suite
    # cannot pull an openbao-image on s390x until one is published.
    needs:
      - k8s-build-s390x
    runs-on: [self-hosted-linux-s390x-noble-medium]
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.3
        with:
          workflows-ref: v3.1.3
      - name: Setup juju on Canonical K8s
        env:
          TOOLCHAINS: python juju-k8s
          JUJU_CHANNEL: 3.6/stable
        run: just setup
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.k8s-build-s390x.outputs.artifacts-key }}
          path: built/
      - name: Locate artifacts
        id: artifacts
        run: |
          echo "charm=$(ls ${{ github.workspace }}/built/*.charm | grep -v kv-requirer | head -1)" >> "$GITHUB_OUTPUT"
          echo "kv-charm=$(ls ${{ github.workspace }}/built/*kv-requirer*.charm 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "snap=$(ls ${{ github.workspace }}/built/*.snap 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
      - name: Run integration tests
        uses: canonical/identity-credentials-workflows/.github/actions/integration-test@v3.1.3
        env:
          KV_REQUIRER_CHARM_FILE_NAME: ${{ steps.artifacts.outputs.kv-charm }}
          PYTEST_ADDOPTS_EXTRA: -k test_deploy_unseal
        with:
          working-directory: charm/k8s
          charm-enabled: "true"
          charm-file-name: ${{ steps.artifacts.outputs.charm }}

  k8s-publish-charm:
    name: Publish K8s Charm
    needs:
      - k8s-quality
      - k8s-integration-test
      - k8s-build
      - k8s-build-kv-requirer
    if: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'release-') }}
    permissions:
      contents: write
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-publish.yaml@v3.1.3
    secrets:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
    with:
      destination_channel: 2.0/edge
      path: charm/k8s
      artifacts-key: ${{ needs.k8s-build.outputs.artifacts-key }}
      charm-paths: ${{ needs.k8s-build.outputs.charm-paths }}
      tag-prefix: k8s

  k8s-publish-charm-arm:
    name: Publish K8s Charm (ARM)
    needs:
      - k8s-quality
      - k8s-integration-test-arm
      - k8s-build-arm
      - k8s-build-kv-requirer
    if: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'release-') }}
    permissions:
      contents: write
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-publish.yaml@v3.1.3
    secrets:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
    with:
      destination_channel: 2.0/edge
      path: charm/k8s
      artifacts-key: ${{ needs.k8s-build-arm.outputs.artifacts-key }}
      charm-paths: ${{ needs.k8s-build-arm.outputs.charm-paths }}
      tag-prefix: k8s
      runner: '["self-hosted", "linux", "ARM64", "medium", "noble"]'

  k8s-publish-charm-s390x:
    name: Publish K8s Charm (s390x)
    needs:
      - k8s-quality
      - k8s-build-s390x
      - k8s-integration-test-s390x
    if: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'release-') }}
    permissions:
      contents: write
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-publish.yaml@v3.1.3
    secrets:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
    with:
      destination_channel: 2.0/edge
      path: charm/k8s
      artifacts-key: ${{ needs.k8s-build-s390x.outputs.artifacts-key }}
      charm-paths: ${{ needs.k8s-build-s390x.outputs.charm-paths }}
      tag-prefix: k8s
      runner: '["self-hosted-linux-s390x-noble-medium"]'

  machine-quality:
    name: Machine Quality
    needs: [ensure-shared-code-in-sync]
    runs-on: ubuntu-24.04
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.3
      - uses: canonical/identity-credentials-workflows/.github/actions/code-quality@v3.1.3
        with:
          working-directory: charm/machine
          python-enabled: "true"
      - uses: canonical/identity-credentials-workflows/.github/actions/unit-test@v3.1.3
        with:
          working-directory: charm/machine
          python-enabled: "true"

  machine-grafana-dashboard-lint-report:
    # A pure label-add (`labeled`) re-triggers CI only to run the arch jobs; the
    # AMD-path jobs below already ran, so skip them on that event to save runners.
    if: github.event.action != 'labeled'
    uses: canonical/identity-credentials-workflows/.github/workflows/grafana-dashboard-lint-report.yaml@v3.1.3
    with:
      path: ./charm/machine/src/grafana_dashboards/*

  machine-build:
    if: github.event.action != 'labeled'
    needs: [machine-quality]
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-build.yaml@v3.1.3
    secrets: inherit
    with:
      path: charm/machine
      artifact-suffix: machine

  machine-build-arm:
    # Runs on merge, or on a PR labelled `test-arm` to verify arm64-specific fixes.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'test-arm')
    needs: [machine-quality]
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-build.yaml@v3.1.3
    secrets: inherit
    with:
      path: charm/machine
      arch: arm64
      runner: '["self-hosted", "linux", "ARM64", "medium", "noble"]'
      artifact-suffix: machine

  machine-build-s390x:
    # Runs on merge, or on a PR labelled `test-s390x` to verify s390x-specific fixes.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'test-s390x')
    needs: [machine-quality]
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-build.yaml@v3.1.3
    secrets: inherit
    with:
      path: charm/machine
      arch: s390x
      runner: '["self-hosted-linux-s390x-noble-medium"]'
      artifact-suffix: machine

  machine-build-kv-requirer:
    needs: [machine-quality]
    uses: ./.github/workflows/build-kv-requirer.yaml
    secrets: inherit
    with:
      path: charm/machine
      artifact-name: kv-requirer-machine-charm

  machine-integration-test:
    if: github.event_name == 'push' || needs.changes.outputs.machine == 'true'
    needs:
      - changes
      - machine-build
      - machine-build-kv-requirer
      - snap-build
    runs-on: [self-hosted, linux, X64, large, noble]
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.3
        with:
          workflows-ref: v3.1.3
      - name: Setup juju on LXD
        env:
          TOOLCHAINS: python juju-machine
          JUJU_CHANNEL: 3.6/stable
        run: just setup
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.machine-build.outputs.artifacts-key }}
          path: built/
      - uses: actions/download-artifact@v8
        with:
          name: kv-requirer-machine-charm
          path: built/
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.snap-build.outputs.artifacts-key }}
          path: built/
      - name: Locate artifacts
        id: artifacts
        run: |
          echo "charm=$(ls ${{ github.workspace }}/built/*.charm | grep -v kv-requirer | head -1)" >> "$GITHUB_OUTPUT"
          echo "kv-charm=$(ls ${{ github.workspace }}/built/*kv-requirer*.charm 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "snap=$(ls ${{ github.workspace }}/built/*.snap 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
      - name: Install minio binaries and configure storage buckets for backup tests
        run: |
          minio_binaries_path="/var/snap/lxd/common/minio"
          sudo mkdir -p ${minio_binaries_path}
          echo "Downloading and installing MinIO binaries to ${minio_binaries_path}"
          sudo wget --quiet --no-clobber https://dl.min.io/server/minio/release/linux-amd64/minio -O ${minio_binaries_path}/minio && sudo chmod +x ${minio_binaries_path}/minio
          sudo wget --quiet --no-clobber https://dl.min.io/client/mc/release/linux-amd64/mc -O ${minio_binaries_path}/mc && sudo chmod +x ${minio_binaries_path}/mc
          sudo snap set lxd minio.path=${minio_binaries_path}
          sudo snap restart lxd
          lxd_bridge_addr=$(sudo lxc network list --format yaml | yq -r '.[] | select(.name == "lxdbr0") | .config["ipv4.address"]' | cut -d'/' -f1)
          echo "Restricting bucket access to the lxd bridge. lxd_bridge_addr=${lxd_bridge_addr}"
          sudo lxc config set core.storage_buckets_address ${lxd_bridge_addr}:8555
          echo "Waiting for Juju to react to the buckets restriction..."
          sleep 30 # For some reason, the Juju controller needs some time to make itself available after restricting the storage buckets address
          sudo lxc storage bucket create default openbao-integration-test
          sudo lxc storage bucket key create default openbao-integration-test openbao-integration-test --role admin --access-key baointegrationtest --secret-key baointegrationtest
      - name: Install MicroCeph and configure RGW for backup tests
        run: |
          echo "Installing MicroCeph snap..."
          sudo snap install microceph
          sudo snap refresh --hold microceph

          echo "Bootstrapping MicroCeph cluster..."
          sudo microceph cluster bootstrap

          echo "Adding loop-file backed OSDs..."
          sudo microceph disk add loop,4G,3

          echo "Waiting for MicroCeph cluster to be healthy..."
          sudo microceph.ceph status
          health=""
          for i in $(seq 1 30); do
            health=$(sudo microceph.ceph health --format json | jq -r '.status')
            if [ "$health" = "HEALTH_OK" ]; then
              echo "Cluster is healthy."
              break
            fi
            echo "Waiting for cluster health... (attempt $i/30, current: $health)"
            sleep 10
          done
          if [ "$health" != "HEALTH_OK" ]; then
            echo "ERROR: Cluster did not become healthy after 300 seconds"
            exit 1
          fi

          echo "Enabling RGW (S3-compatible gateway) on port 7480..."
          sudo microceph enable rgw --port 7480

          echo "Waiting for RGW to be ready..."
          rgw_ready=false
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:7480 | grep -q "200\|403"; then
              echo "RGW is responding."
              rgw_ready=true
              break
            fi
            echo "Waiting for RGW... (attempt $i/30)"
            sleep 5
          done
          if [ "$rgw_ready" != "true" ]; then
            echo "ERROR: RGW did not become ready after 150 seconds"
            exit 1
          fi

          echo "Creating S3 user for OpenBao integration tests..."
          sudo microceph.radosgw-admin user create \
            --uid=openbaomicrocephtest \
            --display-name="OpenBao MicroCeph Test" \
            --access-key=openbaomicrocephtest \
            --secret-key=openbaomicrocephtest

          echo "Creating S3 bucket..."
          sudo apt-get install -y -qq s3cmd > /dev/null
          s3cmd --access_key=openbaomicrocephtest \
            --secret_key=openbaomicrocephtest \
            --host=127.0.0.1:7480 \
            --host-bucket="127.0.0.1:7480/%(bucket)" \
            --no-ssl \
            mb s3://openbao-microceph-test

          echo "MicroCeph RGW setup complete."
          sudo microceph status
      - name: Run integration tests
        uses: canonical/identity-credentials-workflows/.github/actions/integration-test@v3.1.3
        env:
          KV_REQUIRER_CHARM_FILE_NAME: ${{ steps.artifacts.outputs.kv-charm }}
        with:
          working-directory: charm/machine
          charm-enabled: "true"
          charm-file-name: ${{ steps.artifacts.outputs.charm }}
          snap-file-name: ${{ steps.artifacts.outputs.snap }}

  machine-integration-test-arm:
    needs:
      - machine-build-arm
      - machine-build-kv-requirer
      - snap-build-arm
    runs-on: [self-hosted, linux, ARM64, medium, noble]
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.3
        with:
          workflows-ref: v3.1.3
      - name: Setup juju on LXD
        env:
          TOOLCHAINS: python juju-machine
          JUJU_CHANNEL: 3.6/stable
        run: just setup
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.machine-build-arm.outputs.artifacts-key }}
          path: built/
      - uses: actions/download-artifact@v8
        with:
          name: kv-requirer-machine-charm
          path: built/
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.snap-build-arm.outputs.artifacts-key }}
          path: built/
      - name: Locate artifacts
        id: artifacts
        run: |
          echo "charm=$(ls ${{ github.workspace }}/built/*.charm | grep -v kv-requirer | head -1)" >> "$GITHUB_OUTPUT"
          echo "kv-charm=$(ls ${{ github.workspace }}/built/*kv-requirer*.charm 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "snap=$(ls ${{ github.workspace }}/built/*.snap 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
      - name: Run integration tests
        uses: canonical/identity-credentials-workflows/.github/actions/integration-test@v3.1.3
        env:
          KV_REQUIRER_CHARM_FILE_NAME: ${{ steps.artifacts.outputs.kv-charm }}
          PYTEST_ADDOPTS_EXTRA: -k test_core.py
        with:
          working-directory: charm/machine
          charm-enabled: "true"
          charm-file-name: ${{ steps.artifacts.outputs.charm }}
          snap-file-name: ${{ steps.artifacts.outputs.snap }}

  machine-integration-test-s390x:
    needs:
      - machine-build-s390x
      - snap-build-s390x
    runs-on: [self-hosted-linux-s390x-noble-medium]
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.3
        with:
          workflows-ref: v3.1.3
      - name: Setup juju on LXD
        env:
          TOOLCHAINS: python juju-machine
          JUJU_CHANNEL: 3.6/stable
        run: just setup
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.machine-build-s390x.outputs.artifacts-key }}
          path: built/
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.snap-build-s390x.outputs.artifacts-key }}
          path: built/
      - name: Locate artifacts
        id: artifacts
        run: |
          echo "charm=$(ls ${{ github.workspace }}/built/*.charm | grep -v kv-requirer | head -1)" >> "$GITHUB_OUTPUT"
          echo "kv-charm=$(ls ${{ github.workspace }}/built/*kv-requirer*.charm 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "snap=$(ls ${{ github.workspace }}/built/*.snap 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
      - name: Run integration tests
        uses: canonical/identity-credentials-workflows/.github/actions/integration-test@v3.1.3
        env:
          KV_REQUIRER_CHARM_FILE_NAME: ${{ steps.artifacts.outputs.kv-charm }}
          PYTEST_ADDOPTS_EXTRA: -k test_deploy_unseal.py
        with:
          working-directory: charm/machine
          charm-enabled: "true"
          charm-file-name: ${{ steps.artifacts.outputs.charm }}
          snap-file-name: ${{ steps.artifacts.outputs.snap }}

  machine-publish-charm:
    name: Publish Machine Charm
    needs:
      - machine-quality
      - machine-integration-test
      - machine-build
      - machine-build-kv-requirer
    if: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'release-') }}
    permissions:
      contents: write
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-publish.yaml@v3.1.3
    secrets:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
    with:
      destination_channel: 2.0/edge
      path: charm/machine
      artifacts-key: ${{ needs.machine-build.outputs.artifacts-key }}
      charm-paths: ${{ needs.machine-build.outputs.charm-paths }}
      tag-prefix: machine

  machine-publish-charm-arm:
    name: Publish Machine Charm (ARM)
    needs:
      - machine-quality
      - machine-build-arm
      - machine-integration-test-arm
      - machine-build-kv-requirer
    if: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'release-') }}
    permissions:
      contents: write
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-publish.yaml@v3.1.3
    secrets:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
    with:
      destination_channel: 2.0/edge
      path: charm/machine
      artifacts-key: ${{ needs.machine-build-arm.outputs.artifacts-key }}
      charm-paths: ${{ needs.machine-build-arm.outputs.charm-paths }}
      tag-prefix: machine
      runner: '["self-hosted", "linux", "ARM64", "medium", "noble"]'

  machine-publish-charm-s390x:
    name: Publish Machine Charm (s390x)
    needs:
      - machine-quality
      - machine-build-s390x
      - machine-integration-test-s390x
    if: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'release-') }}
    permissions:
      contents: write
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-publish.yaml@v3.1.3
    secrets:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
    with:
      destination_channel: 2.0/edge
      path: charm/machine
      artifacts-key: ${{ needs.machine-build-s390x.outputs.artifacts-key }}
      charm-paths: ${{ needs.machine-build-s390x.outputs.charm-paths }}
      tag-prefix: machine
      runner: '["self-hosted-linux-s390x-noble-medium"]'
