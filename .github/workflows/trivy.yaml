name: Scan UV dependencies

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  scan-k8s:
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: ./.github/workflows/uv-scan.yaml
    with:
      path: ./charm/k8s
  scan-machine:
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: ./.github/workflows/uv-scan.yaml
    with:
      path: ./charm/machine
