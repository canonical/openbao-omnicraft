name: ARM Integration tests (K8s)

on:
  workflow_call:
    inputs:
      path:
        description: Path to the charm's root directory
        required: true
        type: string
      openbao-charm-artifact-name:
        description: Name of the artifact to be downloaded for the openbao charm
        required: true
        type: string
      openbao-rock-artifact-name:
        description: Name of the artifact containing the openbao rock (OCI archive)
        required: true
        type: string
      kv-requirer-charm-artifact-name:
        description: Name of the artifact to be downloaded for the kv-requirer charm
        required: true
        type: string

jobs:
  integration-test-core-arm:
    name: Integration Test Core (ARM)
    runs-on: [self-hosted, linux, ARM64, medium, noble]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup operator environment
        uses: charmed-kubernetes/actions-operator@main
        with:
          provider: microk8s
          channel: 1.35-strict/stable
          juju-channel: 3.6/stable

      - name: Install UV and Tox
        run: |
          pipx uninstall tox
          sudo snap install astral-uv --classic
          uv tool install tox --with tox-uv --force
      - name: Enable Metallb
        run: |
          /usr/bin/sg snap_microk8s -c "sudo microk8s enable metallb:10.0.0.2-10.0.0.8"
      - name: Fetch Charm Under Test
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.openbao-charm-artifact-name }}
          path: ${{ inputs.path }}built/
      - name: Fetch KV Requirer Charm
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.kv-requirer-charm-artifact-name }}
          path: ${{ inputs.path }}built/
      - name: Fetch OpenBao Rock
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.openbao-rock-artifact-name }}
          path: ${{ inputs.path }}rock/
      - name: Import OpenBao rock into MicroK8s
        working-directory: ${{ inputs.path }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo > /dev/null
          ROCK=$(ls rock/*.rock | head -1)
          IMAGE=$(yq '.resources.openbao-image.upstream-source' charmcraft.yaml)
          echo "Importing ${ROCK} as ${IMAGE}"
          # Keep the archive inside the workspace and import via stdin: the
          # strictly confined microk8s snap cannot read the host's /tmp.
          sudo skopeo --insecure-policy copy "oci-archive:${ROCK}" "docker-archive:rock/openbao-rock.tar:${IMAGE}"
          sudo microk8s ctr image import - < rock/openbao-rock.tar
          sudo microk8s ctr image ls | grep openbao
      - name: Get Charm Path
        id: charm-path
        working-directory: ${{ inputs.path }}
        run: |
          OPENBAO_CHARM=$(ls built/*.charm | grep -v kv-requirer | head -1)
          KV_CHARM=$(ls built/*kv-requirer*.charm | head -1)
          echo "openbao-charm=${OPENBAO_CHARM}" >> "$GITHUB_OUTPUT"
          echo "kv-charm=${KV_CHARM}" >> "$GITHUB_OUTPUT"
      - name: Run test_core integration test
        working-directory: ${{ inputs.path }}
        run: |
          tox -e integration -- \
            --charm_path=${{ steps.charm-path.outputs.openbao-charm }} \
            --kv_requirer_charm_path=${{ steps.charm-path.outputs.kv-charm }} \
            -k "test_core.py"
      - name: Archive charmcraft logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: charmcraft-logs-test_core-k8s-arm
          path: /home/runner/.local/state/charmcraft/log/*.log
      - name: Archive juju crashdump
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: juju-crashdump-k8s-test_core-arm
          path: ${{ inputs.path }}/juju-crashdump-*.tar.xz
